name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - run: npm ci --omit=dev
      - name: Smoke test
        run: npm test
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Publish to npm
        run: npm publish --provenance --registry=https://registry.npmjs.org --access public
      - name: Verify npm publication
        env:
          NPM_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 12); do
            published_version=$(npm view "${package_name}@${package_version}" version --registry="$NPM_REGISTRY" 2>/dev/null || true)
            latest_version=$(npm view "$package_name" dist-tags.latest --registry="$NPM_REGISTRY" 2>/dev/null || true)
            if [ "$published_version" = "$package_version" ] && [ "$latest_version" = "$package_version" ]; then
              echo "Verified $package_name@$package_version on $NPM_REGISTRY"
              exit 0
            fi
            echo "Waiting for $package_name@$package_version to appear on npm (attempt $attempt/12)"
            sleep 5
          done
          echo "npm publication verification failed for $package_name@$package_version" >&2
          echo "Published version: ${published_version:-<missing>}" >&2
          echo "latest dist-tag: ${latest_version:-<missing>}" >&2
          exit 1
      - name: Publish to official MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_PRIVATE_KEY"
          curl -fsSL --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-publisher" login dns \
            -domain crawlora.net \
            -private-key "$MCP_PRIVATE_KEY"
          "$RUNNER_TEMP/mcp-publisher" validate
          "$RUNNER_TEMP/mcp-publisher" publish
      - name: Verify official MCP Registry publication
        env:
          MCP_REGISTRY: https://registry.modelcontextprotocol.io/v0/servers?search=net.crawlora%2Fcrawlora-mcp
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 12); do
            latest_version=$(curl -fsSL "$MCP_REGISTRY" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                const latest = (payload.servers ?? []).find(entry =>
                  entry._meta?.["io.modelcontextprotocol.registry/official"]?.isLatest,
                );
                process.stdout.write(latest?.server?.version ?? "");
              });
            ')
            if [ "$latest_version" = "$package_version" ]; then
              echo "Verified net.crawlora/crawlora-mcp@$package_version on the official MCP Registry"
              exit 0
            fi
            echo "Waiting for net.crawlora/crawlora-mcp@$package_version to appear in the official registry (attempt $attempt/12)"
            sleep 5
          done
          echo "Official MCP Registry publication verification failed" >&2
          echo "Expected version: $package_version" >&2
          echo "Observed latest version: ${latest_version:-<missing>}" >&2
          exit 1
      - name: Verify MCP directory listings
        run: node scripts/verify-directory-drift.mjs
