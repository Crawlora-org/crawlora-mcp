name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: crawlora-mcp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Validate release contract
        run: npm run check:release
      - name: Verify MCP.so README tool catalog
        run: npm run check:readme-tools
      - name: Test publication checks
        run: npm run test:publication
      - name: Smoke test
        run: npm test
      - name: Verify npm package contents
        env:
          PACK_REPORT: ${{ runner.temp }}/crawlora-mcp-pack.json
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$PACK_REPORT"
          PACK_REPORT="$PACK_REPORT" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.env.PACK_REPORT, "utf8"));
          const files = new Set((report[0]?.files ?? []).map((file) => file.path));
          for (const required of ["index.mjs", "tools.json"]) {
            if (!files.has(required)) throw new Error(`npm package is missing ${required}`);
          }
          console.log(`npm package contents valid: ${[...files].join(", ")}`);
          NODE
      - name: Publish to npm with trusted publishing
        env:
          NPM_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          metadata_file=$(mktemp)
          trap 'rm -f "$metadata_file"' EXIT
          encoded_name=$(node -p "encodeURIComponent('$package_name')")
          curl --fail-with-body --silent --show-error --location --retry 3 \
            "${NPM_REGISTRY}/${encoded_name}" > "$metadata_file"
          version_exists=$(METADATA_FILE="$metadata_file" PACKAGE_VERSION="$package_version" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync(process.env.METADATA_FILE, "utf8"));
          process.stdout.write(metadata.versions?.[process.env.PACKAGE_VERSION] ? "yes" : "no");
          NODE
          )
          if [ "$version_exists" = "yes" ]; then
            echo "${package_name}@${package_version} already exists; verifying instead of republishing"
          else
            echo "Publishing ${package_name}@${package_version} with npm trusted publishing and provenance"
            npm publish --provenance --registry="$NPM_REGISTRY" --access public
          fi
      - name: Publish to official MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_PRIVATE_KEY" || {
            echo "MCP_PRIVATE_KEY is missing; configure the DNS-authenticated official registry publisher secret." >&2
            exit 1
          }
          curl -fsSL --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-publisher" login dns \
            -domain crawlora.net \
            -private-key "$MCP_PRIVATE_KEY"
          "$RUNNER_TEMP/mcp-publisher" validate
          package_version=$(node -p "require('./package.json').version")
          latest_version=$(curl -fsSL --retry 3 \
            'https://registry.modelcontextprotocol.io/v0/servers?search=net.crawlora%2Fcrawlora-mcp' \
            | node --input-type=module -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                const latest = (payload.servers ?? []).find((entry) =>
                  entry._meta?.["io.modelcontextprotocol.registry/official"]?.isLatest,
                );
                process.stdout.write(latest?.server?.version ?? "");
              });
            ')
          if [ "$latest_version" = "$package_version" ]; then
            echo "Official MCP Registry already points to $package_version; verifying instead of republishing"
          else
            "$RUNNER_TEMP/mcp-publisher" publish
          fi
      - name: Verify every publication surface
        run: npm run check:published
      - name: Create GitHub release after all publication checks pass
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Publish follow-up checklist on failure
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ### Required manual follow-up

          If a public directory check failed, refresh the affected page and rerun **MCP directory drift**:

          - [Glama profile and repository sync](https://glama.ai/mcp/servers/Crawlora-org/crawlora-mcp/admin/profile)
          - [Smithery release](https://smithery.ai/servers/crawlora/crawlora/releases) — its private scan requires an API key
          - [MCP.so editor](https://mcp.so/servers/crawlora-mcp)
          - [Official MCP Registry](https://registry.modelcontextprotocol.io/?search=net.crawlora%2Fcrawlora-mcp)
          - [MCP Servers.org listing](https://mcpservers.org/servers/crawlora-net-mcp) — update request submitted
          - [GoodFirms listing](https://www.goodfirms.co/software/crawlora) — update the claimed vendor profile
          - [StackShare search](https://stackshare.io/?q=crawlora) — create a listing only if desired
          - [PulseMCP](https://www.pulsemcp.com/) — submissions currently paused

          See [RELEASE_CHECKLIST.md](https://github.com/Crawlora-org/crawlora-mcp/blob/main/RELEASE_CHECKLIST.md) for the SDK, skills, profile, and trusted-publishing batch.
          EOF
