name: MCP directory drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: mcp-directory-drift
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate release contract
        run: npm run check:release
      - name: Verify public MCP directories
        run: node scripts/verify-directory-drift.mjs
